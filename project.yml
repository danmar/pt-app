name: PTApp
options:
  bundleIdPrefix: se.minpt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PTApp:
    type: application
    platform: iOS
    sources:
      - PTApp
    entitlements:
      path: PTApp/PTApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        # Byt till ett unikt id, t.ex. se.dittnamn.ptapp
        PRODUCT_BUNDLE_IDENTIFIER: se.minpt.ptapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Min PT"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Min PT läser dina steg, din gångdistans och dina promenader för att visa hur mycket du rör dig varje dag."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Min PT sparar dina träningspass i Apple Hälsa."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
