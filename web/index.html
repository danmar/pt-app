<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Min PT</title>
  <meta name="description" content="Din personliga tränare: passförslag för gym, hemma och simning, animerade övningar och träningslogg.">
  <meta name="theme-color" content="#f1e9ff">
  <script>
    // Färgtema sätts direkt så att sidan inte blinkar till i fel färg (samma logik som applyTheme i app.js).
    try {
      const t = (JSON.parse(localStorage.getItem('minpt-data-v1')) || {}).settings || {};
      const dark = t.themeMode === 'dark' || (t.themeMode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      if (t.themeAccent && t.themeAccent !== 'purple') document.documentElement.dataset.accent = t.themeAccent;
    } catch (e) { /* standardtema */ }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Min PT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Huvudmeny">
    <button data-action="tab" data-tab="start">
      <svg viewBox="0 0 24 24"><path d="M12 3c.8 3.6 5 5.4 5 10.2A5 5 0 0 1 7 13.2c0-2.4 1.3-3.6 2-5 .8 1 1.3 2 2 2.6.5-2.6.1-5.2 1-7.8z"/></svg>
      <span>Idag</span>
    </button>
    <button data-action="tab" data-tab="plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Planera</span>
    </button>
    <button data-action="tab" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Logg</span>
    </button>
    <button data-action="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
      <span>Grafer</span>
    </button>
    <button data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>Inställningar</span>
    </button>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grabber"></div>
      <div class="sheet-body"></div>
    </div>
  </div>

  <section id="workout" class="workout" hidden aria-label="Pågående pass"></section>
  <div id="dialog" class="dialog-backdrop" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Min PT behöver JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
